# Calendar: next events (calendar.get_events action) from one or more calendars, sorted by date.
# Touching it opens a month view (previous / next month), also from the header date: ui::header(it, r, "<id>").
#   packages:
#     agenda: !include
#       file: widgets/agenda.yaml
#       vars: { id: agenda, calendars: "calendar.family, calendar.birthdays" }
# Draw: id(agenda)(it, {x, y, w, 85 + 66 * max_events});
defaults:
  id: agenda
  title: Calendar
  duration: "168:00:00"   # look-ahead window (7 days)
  max_events: "7"
  max_chars: "30"          # max length of an event title

esphome:
  includes:
    - agenda.h

globals:
  - id: ${id}_events
    type: std::string
    restore_value: no
  # Month view: months from the current one, events per month offset (see ui::Month), fetch in progress.
  - id: ${id}_month
    type: int
    restore_value: no
    initial_value: '0'
  - id: ${id}_month_cache
    type: std::map<int, std::string>
    restore_value: no
  - id: ${id}_month_fetching   # month offset being fetched
    type: int
    restore_value: no
    initial_value: '0'
  - id: ${id}_month_done       # response received for it
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id}_month_range   # "YYYY-MM-DD 00:00:00" of the first cell and of the day after the last one
    type: std::vector<std::string>
    restore_value: no
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) {
        const ui::Month month{"${id}", ${id}_month->value(), ${id}_month_cache->value(),
                              [](int o) { ${id}_month_fetch->execute(o); }};
        ui::agenda(it, r, "${title}", ${id}_events->value(), ${max_events}, &month);
      }

script:
  - id: !extend fetch_data
    then:
      - homeassistant.action:
          action: calendar.get_events
          data:
            entity_id: ${calendars}
            duration: ${duration}
          capture_response: true
          # One line per event: days_from_today|weekday (0 = Monday)|day_of_month|time|title
          response_template: |-
            {%- set ns = namespace(ev=[]) -%}
            {%- for k, v in response.items() -%}{%- set ns.ev = ns.ev + v.events -%}{%- endfor -%}
            {%- set today = now().date() -%}
            {%- for e in (ns.ev | sort(attribute='start'))[:${max_events}] -%}
            {%- set d = strptime(e.start[:10], '%Y-%m-%d').date() -%}
            {{ (d - today).days }}|{{ d.weekday() }}|{{ d.day }}|{{ e.start[11:16] }}|{{ e.summary | replace('|', '/') | replace('\n', ' ') | truncate(${max_chars}, true, '...', 0) }}
            {% endfor -%}
          on_success:
            - lambda: |-
                auto v = response["response"];
                id(${id}_events) = v.is<const char *>() ? std::string(v.as<const char *>()) : "";
          on_error:
            - logger.log:
                format: "calendar.get_events: %s"
                args: ["error.c_str()"]

  # Month view: events of a month's grid, one month at a time (displayed month first, then the ones around it).
  # All-day events end on the day after, timed ones on their last day.
  - id: ${id}_month_fetch
    mode: queued
    max_runs: 6
    parameters:
      offset: int
    then:
      # Already fetched (e.g. queued twice: prefetch, then displayed).
      - if:
          condition:
            lambda: return !id(${id}_month_cache).count(offset);
          then:
            - lambda: |-
                id(${id}_month_fetching) = offset;
                id(${id}_month_done) = false;
                id(${id}_month_range) = {ui::month_start(offset), ui::month_end(offset)};
            - homeassistant.action:
                action: calendar.get_events
                data:
                  entity_id: ${calendars}
                  start_date_time: !lambda return id(${id}_month_range)[0];
                  end_date_time: !lambda return id(${id}_month_range)[1];
                capture_response: true
                # One line per event: start|end (exclusive)|time (empty = all day)|title, dates as YYYY-MM-DD
                response_template: |-
                  {%- set ns = namespace(ev=[]) -%}
                  {%- for k, v in response.items() -%}{%- set ns.ev = ns.ev + v.events -%}{%- endfor -%}
                  {%- for e in (ns.ev | sort(attribute='start'))[:250] -%}
                  {%- set allday = e.start | length == 10 -%}
                  {%- if allday -%}{%- set end = e.end[:10] -%}
                  {%- else -%}{%- set end = (strptime(e.end[:10], '%Y-%m-%d') + timedelta(days=0 if e.end[11:16] == '00:00' and e.end[:10] > e.start[:10] else 1)).strftime('%Y-%m-%d') -%}
                  {%- endif -%}
                  {{ e.start[:10] }}|{{ end }}|{{ '' if allday else e.start[11:16] }}|{{ e.summary | replace('|', '/') | replace('\n', ' ') | truncate(40, true, '...', 0) }}
                  {% endfor -%}
                on_success:
                  - lambda: |-
                      auto v = response["response"];
                      id(${id}_month_cache)[id(${id}_month_fetching)] = v.is<const char *>() ? v.as<const char *>() : "";
                      id(${id}_month_done) = true;
                on_error:
                  - lambda: |-
                      id(${id}_month_cache)[id(${id}_month_fetching)] = "";
                      id(${id}_month_done) = true;
                  - logger.log:
                      format: "calendar.get_events (month): %s"
                      args: ["error.c_str()"]
            # No answer from HA: show the month empty.
            - wait_until:
                condition:
                  lambda: return id(${id}_month_done);
                timeout: 8s
            - lambda: |-
                if (!id(${id}_month_done)) id(${id}_month_cache)[offset] = "";
            # The displayed month was waiting for it: redraw.
            - if:
                condition:
                  lambda: return ui::is_open("${id}") && id(${id}_month) == offset;
                then:
                  - component.update: epaper_display
