# One room (climate.* entity): measured temperature, target, humidity, heating indicator.
# Include once per room, then list the rooms in ui::rooms:
#   packages:
#     living_room: !include { file: widgets/room.yaml, vars: { id: living_room, entity: climate.living_room, name: Living room } }
# Draw: ui::rooms(it, {x, y, w, h}, "Rooms", {id(living_room), id(kitchen)});
esphome:
  includes:
    - rooms.h

globals:
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) {
        ui::room_row(it, r, {"${name}", ${id}_cur, ${id}_target, ${id}_hum, ${id}_action});
      }

sensor:
  - platform: homeassistant
    id: ${id}_cur
    entity_id: ${entity}
    attribute: current_temperature
  - platform: homeassistant
    id: ${id}_target
    entity_id: ${entity}
    attribute: temperature
  - platform: homeassistant
    id: ${id}_hum
    entity_id: ${entity}
    attribute: current_humidity

text_sensor:
  - platform: homeassistant
    id: ${id}_action
    entity_id: ${entity}
    attribute: hvac_action
