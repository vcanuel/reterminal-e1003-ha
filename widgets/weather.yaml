# Weather from a weather.* entity: current conditions + 5-day forecast (weather.get_forecasts action).
# Touching it opens a sub-page: current details, next 12 hours (hourly forecast, when the integration has one),
# next 7 days.
#   packages:
#     weather: !include { file: widgets/weather.yaml, vars: { id: weather, entity: weather.home } }
# Draw: id(weather)(it, {x, y, 980, 620});
defaults:
  id: weather

esphome:
  includes:
    - weather.h

globals:
  - id: ${id}_forecast
    type: std::string
    restore_value: no
  - id: ${id}_details
    type: std::string
    restore_value: no
  - id: ${id}_hourly
    type: std::string
    restore_value: no
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) {
        ui::weather(it, r, {"${id}", ${id}_state, ${id}_temp, ${id}_hum, ${id}_wind, ${id}_forecast->value(),
                            ${id}_details->value(), ${id}_hourly->value(), ${id}_icon_xl, ${id}_icon_m, ${id}_temp_xl});
      }

sensor:
  - platform: homeassistant
    id: ${id}_temp
    entity_id: ${entity}
    attribute: temperature
  - platform: homeassistant
    id: ${id}_hum
    entity_id: ${entity}
    attribute: humidity
  - platform: homeassistant
    id: ${id}_wind
    entity_id: ${entity}
    attribute: wind_speed

text_sensor:
  - platform: homeassistant
    id: ${id}_state
    entity_id: ${entity}

script:
  - id: !extend fetch_data
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${entity}
            type: daily
          capture_response: true
          # First line: current details (see Weather::details in weather.h), formatted with their unit.
          # Then one line per day: condition|max|min|precipitation|weekday (0 = Monday)|precipitation probability|wind
          response_template: |-
            {%- set e = '${entity}' -%}
            {%- set wu = ' ' ~ (state_attr(e, 'wind_speed_unit') or 'km/h') -%}
            {%- for a, u in [('apparent_temperature', '°'), ('dew_point', '°'),
                             ('pressure', ' ' ~ (state_attr(e, 'pressure_unit') or 'hPa')), ('wind_speed', wu),
                             ('wind_bearing', ''), ('wind_gust_speed', wu), ('uv_index', ''), ('cloud_coverage', ' %'),
                             ('visibility', ' ' ~ (state_attr(e, 'visibility_unit') or 'km'))] -%}
            {%- set x = state_attr(e, a) -%}
            {{ (x | round(0) | int) ~ u if x is number else '' }}{{ '|' if not loop.last else '\n' }}
            {%- endfor -%}
            {%- for f in response[e].forecast[:7] -%}
            {{ f.condition }}|{{ f.temperature | round(0) | int }}|{{ (f.templow | default(f.temperature)) | round(0) | int }}|{{ f.precipitation | default(0) }}|{{ as_local(as_datetime(f.datetime)).weekday() }}|{{ f.precipitation_probability | round(0) | int if f.precipitation_probability is number else '' }}|{{ (f.wind_speed | round(0) | int) ~ wu if f.wind_speed is number else '' }}
            {% endfor -%}
          on_success:
            - lambda: |-
                auto v = response["response"];
                const std::string s = v.is<const char *>() ? v.as<const char *>() : "";
                const size_t nl = s.find('\n');
                id(${id}_details) = s.substr(0, nl);
                id(${id}_forecast) = nl == std::string::npos ? "" : s.substr(nl + 1);
          on_error:
            - logger.log:
                format: "weather.get_forecasts (daily): %s"
                args: ["error.c_str()"]
      # Next 12 hours, for the sub-page (not every integration provides an hourly forecast).
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${entity}
            type: hourly
          capture_response: true
          # One line per hour: condition|temperature|precipitation probability|precipitation|hour
          response_template: |-
            {%- for f in response['${entity}'].forecast[:12] -%}
            {{ f.condition }}|{{ f.temperature | round(0) | int }}|{{ f.precipitation_probability | round(0) | int if f.precipitation_probability is number else '' }}|{{ f.precipitation | default(0) }}|{{ as_local(as_datetime(f.datetime)).hour }}
            {% endfor -%}
          on_success:
            - lambda: |-
                auto v = response["response"];
                id(${id}_hourly) = v.is<const char *>() ? std::string(v.as<const char *>()) : "";
          on_error:
            - lambda: id(${id}_hourly) = "";
            - logger.log:
                format: "weather.get_forecasts (hourly): %s"
                args: ["error.c_str()"]

font:
  - { file: "gfonts://Inter@700", id: "${id}_temp_xl", size: 230, bpp: 2, glyphs: "0123456789-.°" }
  - file: { type: web, url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf" }
    id: ${id}_icon_xl
    size: 300
    bpp: 2
    glyphs: &weather_glyphs
      - "\U000F0594"  # weather-night
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog
      - "\U000F0592"  # weather-hail
      - "\U000F0593"  # weather-lightning
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0596"  # weather-pouring
      - "\U000F0597"  # weather-rainy
      - "\U000F0598"  # weather-snowy
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0599"  # weather-sunny
      - "\U000F059D"  # weather-windy
      - "\U000F059E"  # weather-windy-variant
      - "\U000F05D6"  # alert-circle-outline
  - file: { type: web, url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf" }
    id: ${id}_icon_m
    size: 100
    bpp: 2
    glyphs: *weather_glyphs
