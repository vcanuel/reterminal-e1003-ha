# Lock (lock.* entity): status tile; touching it opens a lock / unlock / open sub-page
# with confirmation (lock.lock / lock.unlock / lock.open actions).
#   packages:
#     front_door: !include { file: widgets/lock.yaml, vars: { id: front_door, entity: lock.front_door, name: Front door } }
# Draw: id(front_door)(it, {x, y, 370, 220});
defaults:
  name: Door
  subtitle: ""

esphome:
  includes:
    - lock.h

globals:
  - id: ${id}_step
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id}_pending
    type: int
    restore_value: no
    initial_value: '0'
  - id: ${id}_msg
    type: std::string
    restore_value: no
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) {
        ui::lock_tile(it, r, {"${id}", "${name}", "${subtitle}", ${id}_state, ${id}_step->value(), ${id}_pending->value(),
                           ${id}_msg->value(), [](const std::string &a) { ${id}_cmd->execute(a); },
                           ${id}_icon, ${id}_big});
      }

text_sensor:
  - platform: homeassistant
    id: ${id}_state
    entity_id: ${entity}
    on_value:
      - if:
          condition:
            lambda: return ui::is_open("${id}") && id(${id}_step) == 1;
          then:
            - lambda: id(${id}_msg) = "";
            - component.update: epaper_display

script:
  - id: ${id}_cmd
    parameters:
      svc: string
    then:
      - homeassistant.action:
          action: !lambda return svc;
          data:
            entity_id: ${entity}
          on_error:
            - lambda: 'id(${id}_msg) = std::string(ui::tr().error) + error;'
            - component.update: epaper_display

font:
  - { file: "gfonts://Inter@700", id: "${id}_big", size: 110, bpp: 2, glyphs: "-.BDJLOUVacdegiklmnopqrtuvé" }
  - file: { type: web, url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf" }
    id: ${id}_icon
    size: 280
    bpp: 2
    glyphs:
      - "\U000F033E"  # lock
      - "\U000F0FC6"  # lock-open-variant
