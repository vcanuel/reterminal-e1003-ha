# Electric car tile: battery level (%), range (km), charger power (> 0 = charging), plugged in.
#   packages:
#     car: !include
#       file: widgets/car.yaml
#       vars:
#         id: car
#         name: Car
#         battery: sensor.car_battery_level
#         range: sensor.car_range
#         charger_power: sensor.car_charger_power
#         plugged: binary_sensor.car_plugged_in
# Draw: id(car)(it, {x, y, 370, 220});
defaults:
  name: Car

esphome:
  includes:
    - car.h

globals:
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) {
        ui::car(it, r, {"${name}", ${id}_battery, ${id}_range, ${id}_charger_power, ${id}_plugged});
      }

sensor:
  - platform: homeassistant
    id: ${id}_battery
    entity_id: ${battery}
  - platform: homeassistant
    id: ${id}_range
    entity_id: ${range}
  - platform: homeassistant
    id: ${id}_charger_power
    entity_id: ${charger_power}

binary_sensor:
  - platform: homeassistant
    id: ${id}_plugged
    entity_id: ${plugged}
