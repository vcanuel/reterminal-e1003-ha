# One person (person.* entity), to list in ui::presence:
#   packages:
#     alice: !include { file: widgets/person.yaml, vars: { id: alice, entity: person.alice, name: Alice } }
# Draw: ui::presence(it, {x, y, 370, 220}, "Presence", {id(alice), id(bob)});
esphome:
  includes:
    - presence.h

globals:
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) { ui::person_row(it, r, "${name}", ${id}_state); }

text_sensor:
  - platform: homeassistant
    id: ${id}_state
    entity_id: ${entity}
