# Power tile: instant power of a sensor in W (smart meter, clamp...).
#   packages:
#     power_meter: !include { file: widgets/power.yaml, vars: { id: power_meter, entity: sensor.power } }
# Draw: id(power_meter)(it, {x, y, 370, 220});
defaults:
  title: Electricity
  subtitle: current consumption

esphome:
  includes:
    - power.h

globals:
  - id: ${id}
    type: std::function<void(display::Display &, display::Rect)>
    restore_value: no
    initial_value: |-
      [](display::Display &it, display::Rect r) { ui::power(it, r, "${title}", "${subtitle}", ${id}_power); }

sensor:
  - platform: homeassistant
    id: ${id}_power
    entity_id: ${entity}
