# Desktop simulator (host platform): replaces hardware.yaml to draw example.yaml with demo data into an image,
# without the screen or Home Assistant. Used to produce the README screenshots:
#
#   ESPHOME_SNAPSHOT_DIR=$PWD/docs .venv/bin/esphome -s name reterminal-sim -s hardware simulator.yaml run example.yaml
#
# Writes example.bmp (dashboard) and the sub-pages example-weather.bmp, example-month.bmp, example-room.bmp,
# example-power.bmp, example-car.bmp and example-lock.bmp, then exits.
# The demo data below targets the ids of example.yaml.

packages:
  fonts: !include fonts.yaml

esphome:
  name: ${name}
  includes:
    - ui_strings.h
    - ui.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(on_mains) = true;
            id(battery_level).publish_state(100);

            id(weather_state).publish_state("partlycloudy");
            id(weather_temp).publish_state(10.5);
            id(weather_hum).publish_state(60);
            id(weather_wind).publish_state(21);
            id(weather_forecast) =
                "partlycloudy|11|6|0|6|10|19 km/h\n"
                "cloudy|13|8|0.2|0|30|15 km/h\n"
                "rainy|12|9|3.5|1|80|32 km/h\n"
                "sunny|14|7|0|2|0|12 km/h\n"
                "sunny|15|6|0|3|0|9 km/h\n"
                "partlycloudy|14|8|0|4|20|14 km/h\n"
                "rainy|11|7|6.1|5|90|38 km/h\n";
            id(weather_details) = "8°|3°|1016 hPa|21 km/h|312|43 km/h|2|75 %|10 km";
            id(weather_hourly) =
                "partlycloudy|10|10|0|14\n"
                "partlycloudy|11|10|0|15\n"
                "cloudy|11|20|0|16\n"
                "cloudy|10|30|0|17\n"
                "rainy|9|60|0.4|18\n"
                "rainy|9|70|1.2|19\n"
                "rainy|8|40|0.3|20\n"
                "cloudy|8|20|0|21\n"
                "clear-night|7|0|0|22\n"
                "clear-night|7|0|0|23\n"
                "clear-night|6|0|0|0\n"
                "fog|6|0|0|1\n";

            // days_from_today|weekday|day_of_month|time|title
            id(agenda_events) =
                "0|6|25||School holidays\n"
                "0|6|25|18:30|Swimming pool\n"
                "1|0|26|08:15|Dentist\n"
                "1|0|26||Bob's birthday\n"
                "2|1|27|17:30|Zumba\n"
                "3|2|28|09:00|Parent-teacher meeting\n"
                "5|4|30|20:00|Dinner at Alice's\n";

            const struct { sensor::Sensor *cur, *target, *hum; text_sensor::TextSensor *action, *mode; float c, t, h; const char *a; } rooms[] = {
              {id(living_room_cur), id(living_room_target), id(living_room_hum), id(living_room_action), id(living_room_mode), 20.1, 19.5, 52, "heating"},
              {id(bedroom_cur), id(bedroom_target), id(bedroom_hum), id(bedroom_action), id(bedroom_mode), 18.4, 17.0, 55, "idle"},
              {id(office_cur), id(office_target), id(office_hum), id(office_action), id(office_mode), 19.8, 19.0, 48, "idle"},
            };
            for (auto &r : rooms) {
              r.cur->publish_state(r.c);
              r.target->publish_state(r.t);
              r.hum->publish_state(r.h);
              r.action->publish_state(r.a);
              r.mode->publish_state("auto");
            }

            id(power_meter_power).publish_state(389);
            id(power_meter_average).publish_state(1240);
            id(power_meter_peak).publish_state(3807);
            id(power_meter_tariff).publish_state("2");
            {
              const float kwh[24] = {0.26, 0.26, 0.34, 0.6, 0.89, 0.39, 1.44, 0.4, 0.34, 0.73, 0.24, 0.77,
                                     0.21, 0.2, 0.17, 0.2, 0.2, 0.26, 0.31, 0.53, 0.29, 0.26, 0.26, 0.38};
              const int now_h = (::time(nullptr) / 3600 + 1) % 24;  // demo: hours in UTC+1
              std::string h;
              for (int i = 0; i < 24; i++) h += std::to_string((now_h + i) % 24) + ":" + ui::fmt(kwh[i], 2) + (i < 23 ? "," : "");
              id(power_meter_hours) = h;
            }
            id(power_meter_days) =
                "1|9.4|1.6\n2|7.8|2.1\n3|7.5|2.8\n4|8.5|2.6\n5|0|8.4\n6|0|7.5\n0|2.5|1.5\n"
                "1|2.5|1.5\n2|8.1|2\n3|11.9|2.1\n4|12.5|2.3\n5|0|9\n6|0|13.8\n0|2.5|2\n";
            id(front_door_state).publish_state("locked");
            id(doorbell_state).publish_state("unlocked");  // Ring to Open on: bell on the front door tile
            id(doorbell_last_ring) = ::time(nullptr) - 3 * 3600;
            id(car_battery).publish_state(69);
            id(car_range).publish_state(263);
            id(car_charger_power).publish_state(0);
            id(car_plugged).publish_state(true);
            id(car_limit).publish_state(80);
            id(car_energy_added).publish_state(5.9);
            id(car_time_to_full).publish_state(0);
            id(car_port_open).publish_state(true);
            id(car_locked).publish_state(true);
            id(car_doors).publish_state(false);
            id(car_windows).publish_state(false);
            id(car_trunk).publish_state(true);
            id(car_frunk).publish_state(false);
            id(car_sentry).publish_state(false);
            id(car_climate_on).publish_state(false);
            id(car_preconditioning).publish_state(false);
            id(car_update_available).publish_state(true);
            id(car_inside).publish_state(15.8);
            id(car_outside).publish_state(12.5);
            id(car_odometer).publish_state(63763.4);
            for (auto *p : {id(car_tpms_fl), id(car_tpms_fr), id(car_tpms_rl), id(car_tpms_rr)}) p->publish_state(2.9);
            id(car_tpms_rl).publish_state(2.75);
            id(car_state).publish_state("asleep");
            id(car_scheduled).publish_state("2026-10-25T21:00:00+00:00");
            id(car_version).publish_state("2026.38.3.1");
            id(car_update_version).publish_state("2026.38.3.2");
            id(alice_state).publish_state("home");
            id(bob_state).publish_state("Work");
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example.bmp
        # Touching the weather opens its sub-page.
        - lambda: ui::touch(300, 400);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-weather.bmp
        # Back to the dashboard, then touching the header date opens the month view (demo events above).
        - lambda: ui::close();
        - component.update: epaper_display
        - lambda: |-
            ui::touch(300, 80);
            ui::held() = false;
            // Month view: events around today (start|end exclusive|time|title).
            auto day = [](int delta) {
              time_t t = ::time(nullptr) + delta * 86400;
              struct tm d;
              localtime_r(&t, &d);
              return ui::ymd(d);
            };
            const struct { int from, to; const char *time, *title; } month[] = {
              {-2, 7, "", "School holidays"}, {0, 1, "18:30", "Swimming pool"}, {1, 2, "08:15", "Dentist"},
              {1, 2, "", "Bob's birthday"}, {2, 3, "17:30", "Zumba"}, {3, 4, "09:00", "Parent-teacher meeting"},
              {5, 6, "20:00", "Dinner at Alice's"}, {-6, -5, "19:00", "Book club"}, {-9, -8, "10:00", "Hairdresser"},
              {9, 10, "", "Recycling"}, {12, 13, "14:00", "Football match"}, {12, 13, "18:00", "Cinema"},
              {12, 13, "20:30", "Concert"}, {12, 13, "22:00", "Late show"}, {15, 16, "12:30", "Lunch with Sam"},
            };
            std::string ev;
            for (auto &e : month) ev += day(e.from) + "|" + day(e.to) + "|" + e.time + "|" + e.title + "\n";
            id(agenda_month_cache)[0] = ev;  // after touching: opening the view empties the cache
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-month.bmp
        - lambda: ui::close();
        - component.update: epaper_display
        # Back to the dashboard, then touching the first room opens its sub-page.
        - lambda: ui::close();
        - component.update: epaper_display
        - lambda: ui::touch(1200, 280);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-room.bmp
        # Back to the dashboard, then touching the electricity tile opens its sub-page.
        - lambda: ui::close();
        - component.update: epaper_display
        - lambda: ui::touch(1150, 1000);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-power.bmp
        # Back to the dashboard, then touching the car tile opens its sub-page.
        - lambda: ui::close();
        - component.update: epaper_display
        - lambda: ui::touch(1150, 1250);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-car.bmp
        # Back to the dashboard, then touching the lock tile opens its sub-page (with the doorbell).
        - lambda: ui::close();
        - component.update: epaper_display
        - lambda: ui::touch(1500, 1000);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-lock.bmp
        - lambda: exit(0);

host:

logger:

# Required by the widgets' homeassistant sensors (no client connects).
api:

time:
  - platform: host
    id: ha_time

globals:
  - id: ui_language
    type: std::string
    restore_value: no
    initial_value: '"${language}"'
  - id: on_mains
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: last_touch
    type: uint32_t
    restore_value: no
    initial_value: '0'

sensor:
  - platform: template
    id: battery_level

script:
  - id: fetch_data
    then:
      - logger.log: "Simulator: no HA data"

display:
  - platform: snapshot
    id: epaper_display
    dimensions: 1872x1404
    update_interval: never
    lambda: |-
      ui::begin(it);
