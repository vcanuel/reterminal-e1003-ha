# Simulateur sur ordinateur (plateforme host) : remplace hardware.yaml pour dessiner example.yaml avec des données
# de démo dans une image, sans écran ni Home Assistant. Sert à produire les captures du README :
#
#   .venv/bin/esphome -s name reterminal-sim -s hardware simulator.yaml run example.yaml
#
# Écrit docs/example.bmp (tableau de bord) et docs/example-lock.bmp (sous-page serrure) puis s'arrête.
# Les données de démo ci-dessous visent les ids de example.yaml.

packages:
  fonts: !include fonts.yaml

esphome:
  name: ${name}
  includes:
    - ui.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(on_mains) = true;
            id(battery_level).publish_state(100);

            id(meteo_state).publish_state("partlycloudy");
            id(meteo_temp).publish_state(10.5);
            id(meteo_hum).publish_state(60);
            id(meteo_wind).publish_state(21);
            id(meteo_forecast) =
                "partlycloudy|11|6|0|6\n"
                "cloudy|13|8|0.2|0\n"
                "rainy|12|9|3.5|1\n"
                "sunny|14|7|0|2\n"
                "sunny|15|6|0|3\n";

            id(agenda_events) =
                "Auj.||Vacances scolaires\n"
                "Auj.|18:30|Piscine\n"
                "Demain|08:15|Dentiste\n"
                "Demain||Anniversaire de Bob\n"
                "Mar 27|17:30|Zumba\n"
                "Mer 28|09:00|Réunion parents-profs\n"
                "Ven 30|20:00|Dîner chez Alice\n";

            const struct { sensor::Sensor *cur, *target, *hum; text_sensor::TextSensor *action; float c, t, h; const char *a; } rooms[] = {
              {id(salon_cur), id(salon_target), id(salon_hum), id(salon_action), 20.1, 19.5, 52, "heating"},
              {id(chambre_cur), id(chambre_target), id(chambre_hum), id(chambre_action), 18.4, 17.0, 55, "idle"},
              {id(bureau_cur), id(bureau_target), id(bureau_hum), id(bureau_action), 19.8, 19.0, 48, "idle"},
            };
            for (auto &r : rooms) {
              r.cur->publish_state(r.c);
              r.target->publish_state(r.t);
              r.hum->publish_state(r.h);
              r.action->publish_state(r.a);
            }

            id(elec_power).publish_state(389);
            id(porte_state).publish_state("locked");
            id(voiture_battery).publish_state(69);
            id(voiture_range).publish_state(263);
            id(voiture_charger_power).publish_state(0);
            id(voiture_plugged).publish_state(true);
            id(alice_state).publish_state("home");
            id(bob_state).publish_state("Travail");
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example.bmp
        # Toucher la tuile serrure ouvre sa sous-page.
        - lambda: ui::touch(1500, 1000);
        - component.update: epaper_display
        - snapshot.take:
            id: epaper_display
            filename: example-lock.bmp
        - lambda: exit(0);

host:

logger:

# Nécessaire aux capteurs homeassistant des widgets (aucun client ne se connecte).
api:

time:
  - platform: host
    id: ha_time

globals:
  - id: on_mains
    type: bool
    restore_value: no
    initial_value: 'true'

sensor:
  - platform: template
    id: battery_level

script:
  - id: fetch_data
    then:
      - logger.log: "Simulateur : pas de données HA"

display:
  - platform: snapshot
    id: epaper_display
    dimensions: 1872x1404
    update_interval: never
    lambda: |-
      ui::begin(it);
