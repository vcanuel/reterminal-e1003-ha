# reTerminal E1003 hardware package (10.3" ePaper 1872x1404, 16 gray levels), independent of the layout:
# ESP32-S3 + PSRAM, it8951 display, GT911 touch, buzzer, LED, battery, SY6974B charger, green button, deep sleep.
#
# Refresh: at boot (HA connection), every ${refresh_interval}, on touch, green button or HA button.
# Each widget that queries HA hooks into it with `script: - id: !extend fetch_data`.
# On battery (charger PG_STAT over I2C): one refresh, then deep sleep for ${sleep_duration}.
#
# The screen file completes the display with its layout lambda:
#   display:
#     - id: !extend epaper_display
#       lambda: |-
#         if (ui::begin(it)) return;   // Wi-Fi setup screen or sub-page
#         ...

packages:
  fonts: !include fonts.yaml

substitutions:
  name: reterminal-e1003
  friendly_name: reTerminal E1003
  ap_ssid: reTerminal-E1003
  refresh_interval: 5min
  sleep_duration: 30min
  language: en              # on-screen texts: en, fr (see ui_strings.h)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - ui_strings.h
    - ui.h
  on_boot:
    - priority: 600
      then:
        # Wake-up by the green button: on_press does not fire (button already released), so beep here.
        - if:
            condition:
              lambda: |-
                auto cause = esp_sleep_get_wakeup_cause();
                return cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1;
            then:
              - script.execute: beep
    - priority: -100
      then:
        - output.turn_on: bsp_battery_enable
        - delay: 20s
        - if:
            condition:
              not:
                wifi.connected:
            then:
              - component.update: epaper_display

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key
  # Refresh as soon as HA is connected (gives HA time to subscribe to actions).
  on_client_connected:
    - delay: 5s
    - script.execute: refresh

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - deep_sleep.prevent: deep_sleep_1

# No Wi-Fi credentials in the firmware: on first boot the screen opens the "${ap_ssid}"
# access point, pick your network in the captive portal (stored in flash).
wifi:
  id: wifi_comp
  ap:
    ssid: ${ap_ssid}
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: ui_language
    type: std::string
    restore_value: no
    initial_value: '"${language}"'
  - id: ap_ssid
    type: std::string
    restore_value: no
    initial_value: '"${ap_ssid}"'
  # Voltage measured at the previous refresh (survives deep sleep).
  - id: last_vbat
    type: float
    restore_value: yes
    initial_value: '0'
  - id: last_touch
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: on_mains
    type: bool
    restore_value: yes
    initial_value: 'true'
  # Last charger REG08, -1 when the I2C read failed.
  - id: charger_stat
    type: int
    restore_value: no
    initial_value: '-1'

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    samples: 64
    filters:
      - multiply: 2.0
  - platform: copy
    source_id: battery_voltage
    name: "Battery"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

# Shown on the device page in HA (diagnostic).
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
    ssid:
      name: "Wi-Fi network"
      entity_category: diagnostic

binary_sensor:
  - platform: template
    id: mains_sensor
    name: "On mains"
    device_class: plug
    lambda: return id(on_mains);
  - platform: template
    id: charging_sensor
    name: "Charging"
    device_class: battery_charging
    lambda: |-
      int s = (id(charger_stat) >> 3) & 3;
      return id(charger_stat) >= 0 && (s == 1 || s == 2);
  - platform: gpio
    id: key_green
    name: "Green button"
    pin:
      number: GPIO3
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute: beep
      - script.execute: refresh

output:
  - platform: gpio
    pin: GPIO16
    id: bsp_led
    inverted: true
  - platform: gpio
    pin: GPIO40
    id: bsp_battery_enable
  - platform: ledc
    pin: GPIO45
    id: buzzer
    frequency: 1500Hz

light:
  - platform: binary
    name: "LED"
    output: bsp_led
    id: onboard_led

button:
  - platform: template
    id: refresh_button
    name: "Refresh screen"
    on_press:
      - script.execute: refresh

deep_sleep:
  id: deep_sleep_1
  sleep_duration: ${sleep_duration}
  wakeup_pin:               # green button
    number: GPIO3
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

interval:
  # Back to the dashboard 2 min after the last touch on a sub-page.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: return !ui::on_dashboard() && millis() - id(last_touch) > 120000;
          then:
            - lambda: ui::close();
            - component.update: epaper_display
  - interval: ${refresh_interval}
    then:
      - script.execute: refresh
  - interval: 2s
    then:
      - script.execute: read_charger

script:
  - id: beep
    mode: restart
    then:
      - output.set_level:
          id: buzzer
          level: 8%
      - delay: 50ms
      - output.turn_off: buzzer
  - id: read_charger
    mode: single
    then:
      - lambda: |-
          uint8_t st;
          if (!id(charger).read_byte(0x08, &st)) {
            if (id(charger_stat) >= 0) ESP_LOGW("power", "SY6974B not responding, falling back to voltage");
            id(charger_stat) = -1;
            return;
          }
          const bool was = id(on_mains), now = st & 0x04;  // PG_STAT
          id(charger_stat) = st;
          id(on_mains) = now;
          if (was && !now) {
            ESP_LOGI("power", "USB unplugged");
            id(refresh).execute();  // refresh, then deep sleep
          }
  # HA action calls of the widgets (weather.get_forecasts, calendar.get_events...), extended by the packages.
  - id: fetch_data
    mode: single
    then:
      - logger.log: "Fetching HA data"
  - id: refresh
    mode: single
    then:
      - light.turn_on: onboard_led
      # Mains or battery: charger PG_STAT. Fallback when I2C fails: voltage jump
      # (plugging USB raises Vbat by ~0.03-0.07 V, unplugging lowers it; >= 4.12 V = end of charge).
      - script.execute: read_charger
      - script.wait: read_charger
      - component.update: battery_voltage
      - lambda: |-
          float v = id(battery_voltage).state;
          if (id(charger_stat) >= 0) {
            if (!std::isnan(v)) id(last_vbat) = v;
            ESP_LOGI("power", "Vbat %.3f V, REG08 0x%02X -> %s", v, id(charger_stat), id(on_mains) ? "mains" : "battery");
          } else if (!std::isnan(v)) {
            float delta = id(last_vbat) > 0 ? v - id(last_vbat) : 0;
            if (v >= 4.12f || delta >= 0.01f) id(on_mains) = true;
            else if (delta <= -0.01f) id(on_mains) = false;
            id(last_vbat) = v;
            ESP_LOGI("power", "Vbat %.3f V -> %s", v, id(on_mains) ? "mains" : "battery");
          }
          id(mains_sensor).publish_state(id(on_mains));
      - wait_until:
          condition: api.connected
          timeout: 30s
      - delay: 1s
      - script.execute: fetch_data
      - script.wait: fetch_data
      # Actions are asynchronous: give the responses time to arrive.
      - delay: 8s
      - component.update: epaper_display
      - light.turn_off: onboard_led
      - if:
          condition:
            lambda: return !id(on_mains);
          then:
            - delay: 10s   # end of the ePaper refresh + states sent to HA
            - deep_sleep.enter: deep_sleep_1

i2c:
  scl: GPIO20
  sda: GPIO19

# SY6974B charger (E1003 v1.0 schematic, page 4/8). Its /INT pin reaches no GPIO (test point TP53 only),
# but it is on I2C: REG08 bit 2 = PG_STAT (valid USB input), bits 4:3 = CHRG_STAT.
i2c_device:
  id: charger
  address: 0x6B

# Touch in a zone declared by a widget: beep + action + redraw.
# Elsewhere on the dashboard: beep + refresh. Elsewhere on a sub-page: nothing.
touchscreen:
  - platform: gt911
    id: e1003_touch
    display: epaper_display
    interrupt_pin: GPIO2
    reset_pin: GPIO48
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d page=%s", touch.x, touch.y, ui::page().key.c_str());
          if (millis() - id(last_touch) < 1500) return;  // the ePaper takes ~1 s to redraw
          id(last_touch) = millis();
          const bool dashboard = ui::on_dashboard();
          if (ui::touch(touch.x, touch.y)) {
            id(beep).execute();
            id(epaper_display).update();
          } else if (dashboard) {
            id(beep).execute();
            id(refresh).execute();
          }

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: never
    grayscale: true
    dithering: true
    update_mode: GC16
    transform:
      mirror_x: true
      mirror_y: false
    # Replaced by the layout lambda of the screen file.
    lambda: |-
      ui::begin(it);
