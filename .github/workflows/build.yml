# Compiles example.yaml for the ESP32-S3 and renders it with the simulator (screenshots as artifacts).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ESPHOME_VERSION: "2026.10.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Dummy secrets
        run: |
          cat > secrets.yaml <<EOS
          api_key: "$(openssl rand -base64 32)"
          ota_password: "ci"
          ap_password: "ci-password"
          EOS

      - name: Cache ESP-IDF / PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Compile example.yaml (ESP32-S3)
        run: esphome compile example.yaml

      - name: Simulator (README screenshots)
        run: |
          mkdir -p snapshots
          ESPHOME_SNAPSHOT_DIR=$PWD/snapshots esphome -s name reterminal-sim -s hardware simulator.yaml run example.yaml --no-logs
          test -s snapshots/example.bmp && test -s snapshots/example-weather.bmp && test -s snapshots/example-room.bmp && test -s snapshots/example-lock.bmp

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: snapshots/*.bmp

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: .esphome/build/reterminal-e1003/build/firmware.factory.bin
          if-no-files-found: error
