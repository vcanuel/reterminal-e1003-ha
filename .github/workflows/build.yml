# Compile example.yaml pour l'ESP32-S3 et le rend avec le simulateur (captures en artefact).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ESPHOME_VERSION: "2026.10.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Secrets factices
        run: |
          cat > secrets.yaml <<EOS
          api_key: "$(openssl rand -base64 32)"
          ota_password: "ci"
          ap_password: "ci-password"
          EOS

      - name: Cache ESP-IDF / PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Compiler example.yaml (ESP32-S3)
        run: esphome compile example.yaml

      - name: Simulateur (captures du README)
        run: |
          mkdir -p snapshots
          ESPHOME_SNAPSHOT_DIR=$PWD/snapshots esphome -s name reterminal-sim -s hardware simulator.yaml run example.yaml --no-logs
          test -s snapshots/example.bmp && test -s snapshots/example-lock.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: snapshots/*.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .esphome/build/reterminal-e1003/build/firmware.factory.bin
          if-no-files-found: error
