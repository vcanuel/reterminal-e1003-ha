# Example screen: copy this file to private/my-screen.yaml (ignored by git), prefix the paths with ../,
# replace the HA entities and adjust the layout.
#
# Compile / flash:  .venv/bin/esphome run private/my-screen.yaml
# HA requirement: ESPHome integration > device > Configure > "Allow the device to perform Home Assistant actions".

substitutions:
  name: reterminal-e1003          # device name in HA
  friendly_name: reTerminal E1003
  language: en                    # on-screen texts: en, fr
  # refresh_interval: 5min        # refresh period on mains
  # sleep_duration: 30min         # deep sleep duration on battery
  hardware: hardware.yaml         # simulator.yaml to render the README screenshots (see README)

packages:
  hardware: !include ${hardware}

  # One package per widget (or per room / person), with its HA entities.
  header: !include widgets/header.yaml
  weather: !include { file: widgets/weather.yaml, vars: { id: weather, entity: weather.home } }
  agenda: !include
    file: widgets/agenda.yaml
    vars: { id: agenda, calendars: "calendar.family, calendar.birthdays" }
  living_room: !include
    file: widgets/room.yaml
    vars: { id: living_room, entity: climate.living_room, name: Living room, modes: "auto,heat,off" }
  bedroom: !include { file: widgets/room.yaml, vars: { id: bedroom, entity: climate.bedroom, name: Bedroom } }
  office: !include { file: widgets/room.yaml, vars: { id: office, entity: climate.office, name: Office } }
  power_meter: !include { file: widgets/power.yaml, vars: { id: power_meter, entity: sensor.power_consumption } }
  front_door: !include { file: widgets/lock.yaml, vars: { id: front_door, entity: lock.front_door, name: Front door } }
  # Doorbell (Nuki Opener), shown on the front door sub-page.
  doorbell: !include
    file: widgets/opener.yaml
    vars: { id: doorbell, entity: lock.doorbell, ring: binary_sensor.doorbell_ring_action, page: front_door }
  # Tesla through TeslaMate (sensor.my_tesla_*); for another car: widgets/car.yaml (tile only).
  car: !include { file: widgets/tesla.yaml, vars: { id: car, car: my_tesla, name: Tesla } }
  alice: !include { file: widgets/person.yaml, vars: { id: alice, entity: person.alice, name: Alice } }
  bob: !include { file: widgets/person.yaml, vars: { id: bob, entity: person.bob, name: Bob } }

# Layout (1872 x 1404 screen): each widget draws inside the given {x, y, width, height} rectangle.
display:
  - id: !extend epaper_display
    lambda: |-
      if (ui::begin(it)) return;  // Wi-Fi setup screen or sub-page (lock)

      ui::header(it, {48, 40, 1776, 100}, "agenda");  // touching the date opens the month view
      it.filled_rectangle(48, 140, 1776, 4, ui::BLACK);

      id(weather)(it, {40, 160, 978, 620});
      it.filled_rectangle(1018, 170, 3, 600, ui::LIGHT);
      ui::rooms(it, {1060, 170, 764, 600}, "Rooms", {id(living_room), id(bedroom), id(office)});

      it.filled_rectangle(48, 800, 1776, 4, ui::BLACK);

      id(agenda)(it, {48, 830, 952, 540});
      it.filled_rectangle(1018, 830, 3, 540, ui::LIGHT);

      ui::title(it, 1060, 830, "\U000F02DC", "Home");
      id(power_meter)(it, {1060, 915, 370, 220});
      id(front_door)(it, {1454, 915, 370, 220});
      id(car)(it, {1060, 1150, 370, 220});
      ui::presence(it, {1454, 1150, 370, 220}, "Presence", {id(alice), id(bob)});
